[package]
name = "talos3d-knowledge-protocol"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/appverket/talos3D"
description = "Domain-neutral portable knowledge envelope and admission contract."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
sha2 = "0.10"

[dev-dependencies]
jsonschema = { version = "0.62.0", default-features = false }
