[workspace]
members = [
    "app-core",
    "crates/cadio-ir",
    "crates/cadio-dwg",
    "crates/cadio-tools",
    "crates/talos3d-capability-api",
    "crates/talos3d-core",
    "crates/talos3d-terrain",
]
resolver = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

[profile.release.package."*"]
opt-level = 3

# All members build from a standalone public checkout. Specialized app
# compositions and domain integration tests live in their owning repositories.

# Temporary upstream renderer correction; see vendor/bevy_pbr/PATCHES.md.
[patch.crates-io]
bevy_pbr = { path = "vendor/bevy_pbr" }
